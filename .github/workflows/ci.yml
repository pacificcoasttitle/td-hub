name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate this repo was missing: five branches were green alone and red merged
  # on 2026-08-26, caught only by hand.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # `npm test` carries the RLS drift guard (src/lib/db/rls-lockdown.test.ts):
      # a table added to the Drizzle schema with no ENABLE ROW LEVEL SECURITY
      # migration fails here. It needs no credentials, and so cannot verify that
      # the migration was actually applied — that is `npm run db:verify-rls`,
      # which needs DATABASE_URL and is run by hand rather than skipped in CI.
      - run: npm test

  # scripts/ is excluded from the tsconfig Vercel builds, so a stale audit script
  # can no longer fail a deploy. This job is what stops it rotting unnoticed.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:scripts
